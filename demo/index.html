<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tartrazine.js - Syntax Highlighting Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    body {
      height: 100vh;
      overflow: hidden;
    }

    .container {
      height: 100%;
      max-width: 100%;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--muted-border-color);
      background: var(--card-background-color);
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .tagline {
      font-size: 0.9rem;
      color: var(--muted-color);
      margin-top: 0.25rem;
    }

    .split-view {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--muted-border-color);
      overflow: hidden;
    }

    .panel:last-child {
      border-right: none;
    }

    .panel-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--muted-border-color);
      background: var(--card-background-color);
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .panel-title {
      font-weight: 600;
      margin: 0;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      flex: 1;
    }

    select {
      padding: 0.25rem 0.5rem;
      font-size: 0.875rem;
      margin: 0;
    }

    .panel-body {
      flex: 1;
      overflow: auto;
      padding: 0;
    }

    textarea {
      width: 100%;
      height: 100%;
      border: none;
      padding: 1rem;
      font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      resize: none;
      font-variant-ligatures: none;
    }

    textarea:focus {
      outline: none;
    }

    #output {
      padding: 1rem;
      font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    #output pre {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    #output code {
      background: transparent;
      padding: 0;
    }

    .panel-footer {
      padding: 0.5rem 1rem;
      border-top: 1px solid var(--muted-border-color);
      font-size: 0.75rem;
      color: var(--muted-color);
      background: var(--card-background-color);
    }

    .loading {
      opacity: 0.5;
      pointer-events: none;
    }

    .error-message {
      background: #f85149;
      color: white;
      padding: 1rem;
      margin: 1rem;
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      .split-view {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }

      .panel {
        border-right: none;
        border-bottom: 1px solid var(--muted-border-color);
      }

      .panel:last-child {
        border-bottom: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Tartrazine.js</h1>
      <div class="tagline">JavaScript syntax highlighting with Pygments compatibility</div>
    </header>

    <div class="split-view">
      <!-- Input Panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Input</span>
          <div class="controls">
            <select id="language-select">
              <optgroup label="Popular">
                <option value="javascript" selected>JavaScript</option>
                <option value="python">Python</option>
                <option value="rust">Rust</option>
                <option value="go">Go</option>
                <option value="typescript">TypeScript</option>
                <option value="java">Java</option>
                <option value="c++">C++</option>
                <option value="c">C</option>
                <option value="ruby">Ruby</option>
                <option value="php">PHP</option>
              </optgroup>
              <optgroup label="More Languages">
                <option value="bash">Bash</option>
                <option value="css">CSS</option>
                <option value="html">HTML</option>
                <option value="json">JSON</option>
                <option value="yaml">YAML</option>
                <option value="sql">SQL</option>
                <option value="markdown">Markdown</option>
                <option value="swift">Swift</option>
                <option value="kotlin">Kotlin</option>
                <option value="scala">Scala</option>
                <option value="haskell">Haskell</option>
                <option value="lua">Lua</option>
                <option value="perl">Perl</option>
                <option value="r">R</option>
                <option value="matlab">MATLAB</option>
                <option value="julia">Julia</option>
                <option value="elixir">Elixir</option>
                <option value="erlang">Erlang</option>
                <option value="clojure">Clojure</option>
              </optgroup>
            </select>
            <select id="theme-select">
              <option value="github-dark" selected>GitHub Dark</option>
              <option value="monokai">Monokai</option>
              <option value="github">GitHub Light</option>
            </select>
          </div>
        </div>
        <div class="panel-body">
          <textarea id="input" spellcheck="false" placeholder="Enter your code here..."></textarea>
        </div>
        <div class="panel-footer">
          <span id="stats">Characters: 0 | Lines: 0</span>
        </div>
      </div>

      <!-- Output Panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Preview</span>
        </div>
        <div class="panel-body">
          <div id="output"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
